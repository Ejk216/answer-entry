[project]
name = "answer-entry-harness"
version = "0.1.0"
description = "Scripted browser harness beneath the answer-entry skill: deterministic read/enter for WeBWorK problem sets."
requires-python = ">=3.11"
dependencies = ["playwright>=1.40"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
harness = "answer_entry.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/answer_entry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
